<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toonball game view</title>
<style>
  :root { --hud-bg: rgba(255,255,255,.92); --hud-fg: #1d2433; --accent: #2b8cff; }
  html, body { margin: 0; height: 100%; background: #0e1116; overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  body.side #stage { left: 50%; }
  #broadcast { position: absolute; background: #000; object-fit: contain; z-index: 2; }
  body.pip #broadcast { right: 2%; bottom: 3%; width: 30%; border: 4px solid #fff;
    border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  body.side #broadcast { left: 0; top: 0; width: 50%; height: 100%; }
  body.game #broadcast { display: none; }

  #hud { position: absolute; left: 2%; top: 3%; z-index: 3; display: flex; gap: 0;
    background: var(--hud-bg); color: var(--hud-fg); border-radius: 999px; overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); font-weight: 700; font-size: 2.2vh; }
  #hud > div { padding: .45em .9em; display: flex; align-items: center; gap: .5em; }
  #hud .brand { background: var(--accent); color: #fff; letter-spacing: .04em; }
  #hud .chip { width: 1.1em; height: 1.1em; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  #hud .clock { font-variant-numeric: tabular-nums; background: #1d2433; color: #fff; }
  #live { position: absolute; right: 2%; top: 3%; z-index: 3; background: #e5293b; color: #fff;
    font-weight: 800; font-size: 1.8vh; padding: .35em .8em; border-radius: 8px; letter-spacing: .1em; }
  body.toy { --hud-bg: #fff6d6; --hud-fg: #5a3210; --accent: #e8542c; }
  body.toy #hud { border: 3px solid #5a3210; font-family: "Comic Sans MS", "Chalkboard", cursive; }

  #controls { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: flex;
    gap: 10px; align-items: center; padding: 10px 16px;
    background: linear-gradient(transparent, rgba(0,0,0,.6)); color: #fff; font-size: 14px; }
  #controls input[type=range] { flex: 1; }
  #controls button, #controls select { font: inherit; border-radius: 6px; border: 0; padding: 4px 10px; }
  body.record #controls { display: none; }
  body.side #hud { left: 52%; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js",
               "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"></div>
<video id="broadcast" muted playsinline></video>
<div id="hud">
  <div class="brand" id="brand">TOONBALL</div>
  <div><span class="chip" id="chip0"></span>HOME</div>
  <div><span class="chip" id="chip1"></span>AWAY</div>
  <div class="clock" id="clock">00:00</div>
</div>
<div id="live">● LIVE</div>
<div id="controls">
  <button id="play">▶</button>
  <input id="seek" type="range" min="0" max="1" step="1" value="0">
  <select id="theme"><option value="wii">Mii stadium</option><option value="toy">Toy box</option></select>
  <select id="layout"><option value="pip">Picture-in-picture</option><option value="side">Side by side</option><option value="game">Game only</option></select>
  <label><input id="pose" type="checkbox" checked> pose from video</label>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
